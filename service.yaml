---
apiVersion: v1
kind: Service
metadata:
  name: rsyslog
  namespace: monitoring
  labels:
    l2: cilium
  annotations:
    external-dns.alpha.kubernetes.io/hostname: rsyslog.lab.local
    lbipam.cilium.io/ips: 192.168.0.141
spec:
  ports:
    - name: tcp
      port: 514
      targetPort: 514
      protocol: TCP
    - name: udp
      port: 514
      targetPort: 514
      protocol: UDP
  type: LoadBalancer
  loadBalancerIP: 192.168.0.141
  selector:
    app: rsyslog

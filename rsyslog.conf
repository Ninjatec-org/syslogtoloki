module(load="imudp")
module(load="imtcp")

input(type="imudp" port="514")
input(type="imtcp" port="514")

template(name="LokiJSON" type="list" option.jsonf="on") {
    property(outname="timestamp" name="timereported" dateFormat="rfc3339" format="jsonf")
    property(outname="hostname" name="hostname" format="jsonf")
    property(outname="appname" name="app-name" format="jsonf")
    property(outname="procid" name="procid" format="jsonf")
    property(outname="facility" name="syslogfacility-text" format="jsonf")
    property(outname="severity" name="syslogseverity-text" format="jsonf")
    property(outname="message" name="msg" format="jsonf")
}

*.* action(
    type="omfile"
    file="/mnt/rsyslog/syslog.jsonl"
    template="LokiJSON"
    fileCreateMode="0644"
    rotation.sizeLimit="104857600"
    rotation.sizeLimitCommand="/usr/local/bin/log_rotation.sh"
    action.resumeRetryCount="-1"
)

*.* action(type="omfile" file="/dev/stdout" template="LokiJSON")

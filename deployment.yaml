apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rsyslog-pv-claim
  namespace: monitoring
spec:
  storageClassName: truenas-ssd-nfs
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rsyslog
  namespace: monitoring
  labels:
    app: rsyslog
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rsyslog
  template:
    metadata:
      labels:
        app: rsyslog
    spec:
      containers:
      - name: rsyslog
        image: ninjatec/rsyslog:1.0.15 # {"$imagepolicy": "flux-system:rsyslog"}
        ports:
        - name: udp
          containerPort: 514
          protocol: UDP
        - name: tcp
          containerPort: 514
          protocol: TCP
        readinessProbe:
          tcpSocket:
            port: tcp
          periodSeconds: 5
        resources:
          limits:
            cpu: 400m
            memory: 1000Mi
          requests:
            memory: 10Mi
            cpu: 50m
        volumeMounts:
        - name: rsyslog-pv-claim
          mountPath: "/mnt/rsyslog"
      - name: alloy
        image: grafana/alloy:v1.22.0
        args:
        - run
        - --server.http.listen-addr=0.0.0.0:12345
        - --storage.path=/var/lib/alloy
        - /etc/alloy/config.alloy
        ports:
        - name: alloy-http
          containerPort: 12345
        readinessProbe:
          httpGet:
            path: /-/ready
            port: alloy-http
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: alloy-http
          initialDelaySeconds: 15
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 400m
            memory: 1000Mi
        volumeMounts:
        - name: rsyslog-pv-claim
          mountPath: /var/log/remote
          readOnly: true
        - name: rsyslog-pv-claim
          mountPath: /var/lib/alloy
          subPath: alloy
        - name: config-volume
          mountPath: /etc/alloy
          readOnly: true
      restartPolicy: Always
      volumes:
      - name: rsyslog-pv-claim
        persistentVolumeClaim:
          claimName: rsyslog-pv-claim
      - name: config-volume
        configMap:
          name: syslog-alloy
